name: Build Apple Full Rules

on:
  push:
    paths:
      - '.github/apple-rules-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build merged Loon Apple rules
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple_All.list' -o /tmp/apple-upstream.list
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          upstream = Path('/tmp/apple-upstream.list').read_text(encoding='utf-8').splitlines()
          existing_path = Path('Rule/Apple.list')
          existing = existing_path.read_text(encoding='utf-8').splitlines() if existing_path.exists() else []

          # Loon supports DOMAIN / DOMAIN-SUFFIX / DOMAIN-KEYWORD / USER-AGENT /
          # IP-CIDR / IP-CIDR6. Surge PROCESS-NAME rules are intentionally omitted.
          supported = ('DOMAIN,', 'DOMAIN-SUFFIX,', 'DOMAIN-KEYWORD,', 'USER-AGENT,', 'IP-CIDR,', 'IP-CIDR6,')

          # This broad Akamai suffix would capture unrelated third-party services.
          # Keep Apple-specific Akamai/CNAME targets instead.
          deny_exact = {
              'DOMAIN-SUFFIX,akadns.net',
          }

          official_2026 = [
              # Apple Intelligence / Siri / Search / Private Cloud Compute
              'DOMAIN,guzzoni.apple.com',
              'DOMAIN-SUFFIX,smoot.apple.com',
              'DOMAIN,apple-relay.cloudflare.com',
              'DOMAIN,apple-relay.fastly-edge.com',
              'DOMAIN,cp4.cloudflare.com',
              'DOMAIN,apple-relay.apple.com',

              # APNs / Apple Push Notification service
              'DOMAIN-SUFFIX,push.apple.com',
              'IP-CIDR,17.249.0.0/16,no-resolve',
              'IP-CIDR,17.252.0.0/16,no-resolve',
              'IP-CIDR,17.57.144.0/22,no-resolve',
              'IP-CIDR,17.188.128.0/18,no-resolve',
              'IP-CIDR,17.188.20.0/23,no-resolve',
              'IP-CIDR6,2620:149:a44::/48,no-resolve',
              'IP-CIDR6,2403:300:a42::/48,no-resolve',
              'IP-CIDR6,2403:300:a51::/48,no-resolve',
              'IP-CIDR6,2a01:b740:a42::/48,no-resolve',

              # iCloud / Private Relay / CloudKit / iWork
              'DOMAIN-SUFFIX,icloud.com',
              'DOMAIN-SUFFIX,icloud.com.cn',
              'DOMAIN-SUFFIX,icloud.apple.com',
              'DOMAIN-SUFFIX,icloud-content.com',
              'DOMAIN-SUFFIX,apple-cloudkit.com',
              'DOMAIN-SUFFIX,apple-livephotoskit.com',
              'DOMAIN-SUFFIX,apzones.com',
              'DOMAIN-SUFFIX,cdn-apple.com',
              'DOMAIN-SUFFIX,gc.apple.com',
              'DOMAIN-SUFFIX,iwork.apple.com',
              'DOMAIN-SUFFIX,apple-dns.net',
              'DOMAIN,gateway.icloud.com',
              'DOMAIN,probe.icloud.com',
              'DOMAIN,pong.icloud.com',
              'DOMAIN,metrics.icloud.com',
              'DOMAIN,apple-native-relay.apple.com',
              'DOMAIN,mask.icloud.com',
              'DOMAIN,mask-h2.icloud.com',
              'DOMAIN,mask-api.icloud.com',
              'DOMAIN,mask-api.fe.apple-dns.net',
              'DOMAIN,mask-t.apple-dns.net',
              'DOMAIN,mask.apple-dns.net',

              # Associated domains
              'DOMAIN,app-site-association.cdn-apple.com',
              'DOMAIN,app-site-association.networking.apple',

              # Apple-specific CDN/CNAME targets
              'DOMAIN-SUFFIX,apple-support.akadns.net',
              'DOMAIN-SUFFIX,apple.com.akadns.net',
              'DOMAIN-SUFFIX,icloud.com.akadns.net',
              'DOMAIN-SUFFIX,apple.com.edgekey.net',
          ]

          rules = []
          seen = set()

          def add(line: str):
              line = line.strip()
              if not line or line.startswith('#') or not line.startswith(supported):
                  return
              if line in deny_exact:
                  return
              if line not in seen:
                  seen.add(line)
                  rules.append(line)

          # Preserve the large upstream domain corpus first.
          for line in upstream:
              add(line)

          # Preserve all previously curated Apple service rules.
          for line in existing:
              add(line)

          # Force in current Apple official endpoints and APNs ranges.
          for line in official_2026:
              add(line)

          # Put the most important service-specific rules first so they are easy to audit.
          priority_prefixes = (
              'DOMAIN,guzzoni.apple.com',
              'DOMAIN-SUFFIX,smoot.apple.com',
              'DOMAIN,apple-relay.',
              'DOMAIN,cp4.cloudflare.com',
              'DOMAIN-SUFFIX,push.apple.com',
              'DOMAIN,mask.',
              'DOMAIN,probe.icloud.com',
              'DOMAIN,pong.icloud.com',
              'DOMAIN,metrics.icloud.com',
              'DOMAIN,apple-native-relay.apple.com',
              'DOMAIN,app-site-association.',
          )
          priority = [r for r in rules if r.startswith(priority_prefixes)]
          rest = [r for r in rules if r not in set(priority)]
          rules = priority + rest

          counts = {}
          for r in rules:
              t = r.split(',', 1)[0]
              counts[t] = counts.get(t, 0) + 1

          header = [
              '# NAME: Apple Full',
              '# AUTHOR: Horatio',
              '# FORMAT: Loon Remote Rule',
              '# UPDATED: ' + datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC'),
              '# SOURCE: blackmatrix7 Apple_All + Apple official enterprise network requirements + Horatio curated rules',
              '# Apple official reference: https://support.apple.com/101555',
              '# APNs reference: https://support.apple.com/102266',
              '# NOTE: PROCESS-NAME entries are excluded because they are not part of Loon Remote Rule syntax.',
              '# NOTE: broad DOMAIN-SUFFIX,akadns.net is excluded to avoid matching unrelated Akamai customers.',
              '# TOTAL: ' + str(len(rules)),
          ]
          for key in ('DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD', 'USER-AGENT', 'IP-CIDR', 'IP-CIDR6'):
              header.append(f'# {key}: {counts.get(key, 0)}')
          header += [
              '#',
              '# Covers Apple Intelligence, Siri, APNs Push, iCloud, Private Relay, Apple ID,',
              '# App Store, TestFlight, Music, TV, News, Maps, Find My, Wallet, system updates,',
              '# developer services, China Apple/iCloud domains, Apple CDN/CNAMEs and legacy Apple domains.',
              '',
          ]

          existing_path.write_text('\n'.join(header + rules) + '\n', encoding='utf-8')
          print(f'Generated {len(rules)} Loon rules')
          PY

      - name: Commit generated rules
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Rule/Apple.list; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Rule/Apple.list
          git commit -m 'Update Apple full Loon rules'
          git push
